# Manual deployment only. Never add push, pull_request or scheduled triggers.
# The owner approved a temporary Pages deployment artifact; no build/test reports
# or dependency caches are uploaded. The Pages artifact expires after one day.
name: Deploy website

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build both sites and publish the dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out sources and pinned exercise art
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Test viewer
        working-directory: web
        run: npm test

      - name: Build viewer and generate art from the submodule
        working-directory: web
        env:
          VITE_GOOGLE_SIGNIN: ${{ vars.VITE_GOOGLE_SIGNIN }}
        run: npm run build

      - name: Verify generated exercise art
        run: python tools/web_art.py --check

      - name: Stage the public landing site
        run: python tools/build_landing.py

      - name: Upload temporary Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/landing
          retention-days: 1

      - name: Publish dashboard to app.ironvellum.org
        id: dashboard
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.168.0'
          command: pages deploy web/dist --project-name=ironvellum --branch=main

      - name: Require a production dashboard deployment
        if: steps.dashboard.outputs.pages-environment != 'production'
        run: |
          echo "::error::Check that main is the production branch of the ironvellum Cloudflare Pages project."
          exit 1

  deploy:
    name: Publish landing page to ironvellum.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Needs pages: write (it calls the Pages API), so it runs here, not beside npm.
      # The build uses a relative base ('./'), so it needs none of its outputs.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
