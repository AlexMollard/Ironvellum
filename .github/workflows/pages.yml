# Manual deployment only. Never add push, pull_request or scheduled triggers.
# The owner approved a temporary Pages deployment artifact; no build/test reports
# or dependency caches are uploaded. The Pages artifact expires after one day.
name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out sources and pinned exercise art
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install pinned browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Test viewer
        working-directory: web
        run: npm test

      - name: Build viewer and generate art from the submodule
        working-directory: web
        run: npm run build

      - name: Verify generated exercise art
        run: python tools/web_art.py --check

      - name: Upload temporary Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
