# Continuous integration for Monarch.
#
# Runs on every push and pull request: debug build, unit tests, release lint,
# and compilation of the instrumented tests.
# Reports are uploaded as build artifacts.
#
# Secrets: this repo reads backend config from local.properties (gitignored).
# On CI we generate that file from repository secrets when they exist, and
# write blank values otherwise — blank credentials are valid for a debug
# build (they disable the Supabase/Google features at runtime via
# `Cloud.configured`). Secrets are passed through the environment rather
# than interpolated into the command line so they are never echoed into the
# job log; GitHub additionally masks secret values in logs.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONARCH_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MONARCH_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MONARCH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches app/build.gradle.kts compileOptions (JavaVersion.VERSION_17).
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) cache provider; free for all repositories.
          cache-provider: basic

      # local.properties does not exist on a fresh clone. Generate it: real
      # values from repository secrets when configured, blanks otherwise.
      # sdk.dir is intentionally omitted — the runner provides the Android
      # SDK location via ANDROID_HOME, which the Android Gradle Plugin picks
      # up automatically.
      - name: Generate local.properties
        run: |
          {
            echo "supabase.url=${MONARCH_SUPABASE_URL:-}"
            echo "supabase.key=${MONARCH_SUPABASE_KEY:-}"
            echo "google.webClientId=${MONARCH_GOOGLE_WEB_CLIENT_ID:-}"
          } > local.properties

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Release lint
        run: ./gradlew :app:lintRelease

      # assembleDebug does NOT compile src/androidTest, so instrumented tests
      # (Room migrations etc.) can be committed broken and go unnoticed until
      # someone attaches a device. This compiles them without needing one.
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest

      # A signed release is a local/owner step: the keystore is a credential
      # and must never enter CI. Release-variant lint coverage is already
      # provided by the :app:lintRelease step above; the signed APK is built
      # and verified locally only.

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml

      - name: Upload androidTest outputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: androidtest-outputs
          path: app/build/outputs/androidTest-results/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

  # The instrumented suite is where migrations against real SQLite, navigation
  # reachability, the accessibility floors and the three user journeys are
  # actually proven. The build job only COMPILES them, so without this they can
  # go red for weeks and nobody would know until someone attached a phone.
  instrumented:
    runs-on: ubuntu-latest
    env:
      MONARCH_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MONARCH_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MONARCH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Generate local.properties
        run: |
          {
            echo "supabase.url=${MONARCH_SUPABASE_URL:-}"
            echo "supabase.key=${MONARCH_SUPABASE_KEY:-}"
            echo "google.webClientId=${MONARCH_GOOGLE_WEB_CLIENT_ID:-}"
          } > local.properties

      # KVM is what makes an x86_64 emulator usable on a runner; without it the
      # boot takes long enough to time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # API 35 google_apis x86_64: the same image the local MonarchEmu AVD
          # runs, so a CI failure reproduces locally without a second guess.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          # The ink treatment animates continuously and the flow tests drive the
          # test clock by hand; system animations on top of that only add jitter.
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-results
          path: app/build/outputs/androidTest-results/
