# Continuous integration for Monarch.
#
# Runs on every push and pull request: debug build, unit tests, release lint,
# and compilation of the instrumented tests.
# Reports are uploaded as build artifacts.
#
# Secrets: this repo reads backend config from local.properties (gitignored).
# On CI we generate that file from repository secrets when they exist, and
# write blank values otherwise — blank credentials are valid for a debug
# build (they disable the Supabase/Google features at runtime via
# `Cloud.configured`). Secrets are passed through the environment rather
# than interpolated into the command line so they are never echoed into the
# job log; GitHub additionally masks secret values in logs.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IRONVELLUM_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      IRONVELLUM_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      IRONVELLUM_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches app/build.gradle.kts compileOptions (JavaVersion.VERSION_17).
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) cache provider; free for all repositories.
          cache-provider: basic

      # local.properties does not exist on a fresh clone. Generate it: real
      # values from repository secrets when configured, blanks otherwise.
      # sdk.dir is intentionally omitted — the runner provides the Android
      # SDK location via ANDROID_HOME, which the Android Gradle Plugin picks
      # up automatically.
      - name: Generate local.properties
        run: |
          {
            echo "supabase.url=${IRONVELLUM_SUPABASE_URL:-}"
            echo "supabase.key=${IRONVELLUM_SUPABASE_KEY:-}"
            echo "google.webClientId=${IRONVELLUM_GOOGLE_WEB_CLIENT_ID:-}"
          } > local.properties

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Release lint
        run: ./gradlew :app:lintRelease

      # assembleDebug does NOT compile src/androidTest, so instrumented tests
      # (Room migrations etc.) can be committed broken and go unnoticed until
      # someone attaches a device. This compiles them without needing one.
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest

      # A signed release is a local/owner step: the keystore is a credential
      # and must never enter CI. Release-variant lint coverage is already
      # provided by the :app:lintRelease step above; the signed APK is built
      # and verified locally only.

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml

      - name: Upload androidTest outputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: androidtest-outputs
          path: app/build/outputs/androidTest-results/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

  # The instrumented suite is where migrations against real SQLite, navigation
  # reachability, the accessibility floors and the three user journeys are
  # actually proven. The build job only COMPILES them, so without this they can
  # go red for weeks and nobody would know until someone attached a phone.
  instrumented:
    runs-on: ubuntu-latest
    env:
      IRONVELLUM_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      IRONVELLUM_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      IRONVELLUM_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Generate local.properties
        run: |
          {
            echo "supabase.url=${IRONVELLUM_SUPABASE_URL:-}"
            echo "supabase.key=${IRONVELLUM_SUPABASE_KEY:-}"
            echo "google.webClientId=${IRONVELLUM_GOOGLE_WEB_CLIENT_ID:-}"
          } > local.properties

      # KVM is what makes an x86_64 emulator usable on a runner; without it the
      # boot takes long enough to time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Measured on run 35684256057, the 726 s emulator step spent 32 s pulling
      # the system image, 6 s creating the AVD and 69 s booting it. A cached
      # snapshot turns the boot into a restore, so that cost is paid once per
      # api level rather than on every push.
      - name: Cache the AVD snapshot
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # The key must name every setting baked into the snapshot: a cached
          # AVD built at a different RAM size or image is not the one the test
          # step then asks for.
          key: avd-35-google_apis-x86_64-pixel_6-2048M

      # Cold cache only: boot once with snapshot saving left on, purely so the
      # step below has something to restore.
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # API 35 google_apis x86_64: the same image the local IronvellumEmu AVD
          # runs, so a CI failure reproduces locally without a second guess.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # 2 GB. The first attempt died silently mid-Gradle with no error and
          # no annotation — an OOM kill. Measured on the runner: 7.8 GiB total
          # with 164 MiB free and 4.5 GiB already in use before Gradle starts,
          # so the original 4 GB emulator plus Gradle at -Xmx4g and a Kotlin
          # daemon inheriting it never had room. Heaps are capped below.
          ram-size: 2048M
          # Reuse the cached AVD rather than overwriting it, and do not spend
          # time writing the snapshot back out at the end of every run.
          force-avd-creation: false
          # The ink treatment animates continuously and the flow tests drive the
          # test clock by hand; system animations on top of that only add jitter.
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          # One line per command: the action feeds this to `sh -c`, where a
          # backslash continuation arrives literally and Gradle reports
          # `Task '\' not found`.
          script: |
            free -h; df -h /
            ./gradlew :app:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g
            free -h

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-results
          path: app/build/outputs/androidTest-results/

  # The Supabase schema carries guarantees no Kotlin test can see: which tables
  # have RLS, which functions a lifter may execute, which columns they may
  # write, whether a feed row can pin itself. Those were each established by a
  # migration to close a specific review finding, and a later migration can
  # undo one silently. This applies the whole chain to a throwaway Postgres and
  # asserts every guarantee still holds.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: probe
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # The stub stands in for the parts of a hosted project the migrations
      # assume: the auth schema, auth.uid(), and the anon/authenticated roles.
      - name: Stand up the schema
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/supabase_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Every migration must SAY which it is. The re-apply below keys off that
      # word, so a file declaring neither would silently opt out of the
      # idempotency check — the coverage would then depend on prose nobody
      # maintains, which is exactly what drifts.
      - name: Every migration declares idempotent or immutable
        run: |
          missing=0
          for f in supabase/migrations/*.sql; do
            if ! grep -qiE "idempotent|immutable" "$f"; then
              echo "::error file=$f::migration declares neither idempotent nor immutable"
              missing=1
            fi
          done
          exit $missing

      # Re-applying must be a no-op for every migration that CLAIMS to be
      # idempotent — that claim is load-bearing, because it is how these files
      # reach the live project. 0001-0004 deliberately do not claim it: they are
      # declared immutable ("already applied"), and all hardening lands in later
      # files instead. So the claim itself selects what gets re-applied, which
      # means a new hardening migration is covered the moment it says so.
      - name: Re-apply the idempotent migrations
        run: |
          for f in supabase/migrations/*.sql; do
            if grep -qi "idempotent" "$f"; then
              echo "re-applying $f"
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            else
              echo "skipping $f (declared immutable)"
            fi
          done

      - name: Assert the backend guarantees
        run: psql -v ON_ERROR_STOP=1 -f supabase/test/assert_all.sql
