# Build, sign and publish a GitHub release for an existing tag.
#
# Manual only (workflow_dispatch), never on push or tag: a release is the
# owner's call every time. The owner pushes the tag first; this job only builds
# what that tag points at.
#
# The release keystore lives in the `release` environment's secrets, so the job
# waits for the owner's approval before it can read them (Settings >
# Environments > release > Required reviewers). It is decoded into the runner's
# temp directory, used once and deleted. The signed APK is attached to the
# GitHub release, which is what Obtainium and IzzyOnDroid read.
#
# Secrets (environment `release`):
#   RELEASE_KEYSTORE_BASE64  base64 of the .jks file
#   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Repository secrets reused from ci.yml: SUPABASE_URL, SUPABASE_KEY.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.7'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The input reaches the shell only through $TAG, and only once it looks like a version tag.
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.7"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      # A tag that disagrees with versionName would publish a release whose APK reports another version.
      - name: Match the tag to versionName
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::tag $TAG does not match versionName $name"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Generate local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          {
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.key=$SUPABASE_KEY"
          } > local.properties

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set in the release environment"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the signed release
        env:
          IRONVELLUM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          IRONVELLUM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          IRONVELLUM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          IRONVELLUM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The build quietly falls back to an unsigned APK when a secret is missing; refuse to publish one.
      - name: Verify the signature
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/foss/release -name '*.apk' ! -name '*unsigned*' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no signed APK; check the release environment's secrets"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          out="ironvellum-$TAG.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "Ironvellum ${TAG#v}" --notes-file "$notes" --verify-tag
          fi
