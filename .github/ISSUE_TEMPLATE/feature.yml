name: Feature request
description: An idea or a change to how something works.
labels: ["enhancement", "triage"]
assignees: ["AlexMollard"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The workout or situation where the app falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
