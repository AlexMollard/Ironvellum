name: Bug report
description: Something in the app doesn't work as it should.
labels: ["bug", "triage"]
assignees: ["AlexMollard"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workout
        2. Tap ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, then About.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
  - type: dropdown
    id: source
    attributes:
      label: Where you installed it
      options:
        - Google Play
        - F-Droid
        - APK from GitHub
        - Built it myself
