[package]
name = "ironvellum-connector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ironvellum-contracts = { path = "../ironvellum-contracts" }
ironvellum-local = { path = "../ironvellum-local" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "signal", "sync", "time", "macros"] }
libc = "=0.2.191"
unicode-general-category = "=1.1.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
sha2 = "=0.10.9"
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }

[[test]]
name = "session"
harness = false
[[test]]
name = "desktop_dispatch"
harness = false
