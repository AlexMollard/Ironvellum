[package]
name = "ironvellum-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
serde_json = "=1.0.145"
ironvellum-local = { path = "../ironvellum-local" }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "accesskit", "wayland", "x11"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12", "metal", "vulkan", "wgsl"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
sys-locale = "=0.3.2"
url = "=2.5.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui-wgpu = {version="=0.33.3",default-features=false}
png = "=0.18.1"
pollster = "=0.4.0"
tempfile = "=3.27.0"
ironvellum-contracts = {path="../ironvellum-contracts"}
ab_glyph = "=0.2.32"
ttf-parser = "=0.25.1"
sha2 = "=0.10.9"
