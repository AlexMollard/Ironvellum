org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# CI spends most of its wall clock compiling, not installing the SDK: measured
# on run 35684256057 the instrumented job gave 343s to compile and 43s to the
# SDK. The build cache lets a task whose inputs did not change be fetched
# instead of rerun, which is what makes a one-file push cheap. setup-gradle
# persists this cache between runs.
org.gradle.caching=true
# Single module today, so this buys little on its own; it costs nothing and
# applies the moment the build gains a second module.
org.gradle.parallel=true
