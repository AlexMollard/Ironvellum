[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironvellum-development-mcp"
version = "0.1.0"
description = "Local Android development tools for Ironvellum"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
ironvellum-development-mcp = "ironvellum_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
